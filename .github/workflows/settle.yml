# À placer dans ton repo sous : .github/workflows/settle.yml
name: Settle matches

on:
  schedule:
    - cron: '0 */3 * * *'    # toutes les 3 h (openfootball est mis à jour ~au jour le jour, inutile de spammer)
  workflow_dispatch: {}        # + bouton "Run workflow" pour lancer à la main

concurrency:
  group: settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin@12 --no-save
      - run: node settle.mjs
        env:
          FB_SA: ${{ secrets.FB_SA }}
