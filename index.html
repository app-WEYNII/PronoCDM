  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("image illisible"));
    };
    img.src = url;
  });
}

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --pitch:#0b2f1e;
  --pitch-2:#0f3b26;
  --line:#2c5a40;
  --chalk:#f2f0e4;
  --chalk-dim:#9fc1ab;
  --gold:#f5c543;
  --loss:#e5533c;
  --won:#5cc97a;
  --refund:#8fa6c9;
}
*{box-sizing:border-box;margin:0;padding:0}
.app{
  min-height:100vh;
  background:
    radial-gradient(1200px 500px at 50% -200px, #15522f 0%, transparent 60%),
    repeating-linear-gradient(180deg, var(--pitch) 0 64px, var(--pitch-2) 64px 128px);
  color:var(--chalk);
  font-family:'Inter',system-ui,sans-serif;
  display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
}
.brand{
  font-family:'Saira Condensed',sans-serif;
  font-weight:800;letter-spacing:.14em;
  color:var(--chalk);line-height:1;
}
.brand.xl{font-size:52px;text-shadow:0 0 24px rgba(245,197,67,.25)}
.logo-hero{display:block;width:min(250px,64%);height:auto;margin:0 auto;border-radius:18px;box-shadow:0 10px 36px rgba(0,0,0,.45)}
.muted{color:var(--chalk-dim)}
.small{font-size:12px}
.center{text-align:center}
.pos{color:var(--won)}
.neg{color:var(--loss)}

/* ---- Topbar ---- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg, rgba(11,47,30,.97) 70%, rgba(11,47,30,0));
}
.brand-row{display:flex;align-items:baseline;gap:10px}
.brand-row .brand{font-size:26px}
.brand-sub{font-size:11px;color:var(--chalk-dim);letter-spacing:.08em;text-transform:uppercase}
.sync-btn{
  display:flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--line);border-radius:999px;
  color:var(--chalk-dim);padding:5px 12px;font-size:12px;cursor:pointer;
}
.ball-spin{display:inline-block;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ball-spin{animation:none}}

/* ---- Layout ---- */
.content{flex:1;padding:8px 16px 96px}
.stack{display:flex;flex-direction:column;gap:12px}
.section-title{
  font-family:'Saira Condensed',sans-serif;font-weight:700;
  font-size:20px;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:2px solid var(--line);padding-bottom:6px;
}

/* ---- Tabbar ---- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:560px;margin:0 auto;
  display:flex;
  background:#081f14;border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 0 8px;background:transparent;border:none;color:var(--chalk-dim);
  font-family:inherit;font-size:11px;cursor:pointer;
}
.tab.active{color:var(--gold)}
.tab.cta .tab-icon{
  background:var(--gold);color:#081f14;border-radius:50%;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;
}
.tab-icon{font-size:18px;line-height:1}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:8px}

/* ---- Inscription ---- */
.join-wrap{padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.join-hero{position:relative;text-align:center;padding:36px 8px 28px;overflow:hidden}
.center-circle{
  position:absolute;left:50%;top:-130px;transform:translateX(-50%);
  width:340px;height:340px;border:2px solid rgba(242,240,228,.16);border-radius:50%;
  pointer-events:none;
}
.hero-sub{margin-top:8px;color:var(--gold);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.hero-line{margin-top:14px;color:var(--chalk-dim);font-size:14px}
.join-card{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:18px;
  padding:20px;display:flex;flex-direction:column;gap:16px;
}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px}
.field>span{color:var(--chalk-dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.field input,.field select,.field textarea{
  background:#0a2718;border:1px solid var(--line);border-radius:10px;
  color:var(--chalk);padding:12px;font-size:16px;font-family:inherit;width:100%;
  resize:vertical;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.field input[type=file]{padding:9px;font-size:13px;color:var(--chalk-dim)}
.import-msg{font-size:13px;border-radius:10px;padding:10px 12px}
.import-msg.ok{background:rgba(92,201,122,.12);color:var(--won);border:1px solid rgba(92,201,122,.35)}
.import-msg.err{background:rgba(229,83,60,.12);color:var(--loss);border:1px solid rgba(229,83,60,.35)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-btn{
  font-size:22px;padding:8px 0;background:#0a2718;border:1px solid var(--line);
  border-radius:10px;cursor:pointer;
}
.emoji-btn.sel{border-color:var(--gold);background:rgba(245,197,67,.12)}
.primary{
  background:var(--gold);color:#081f14;border:none;border-radius:12px;
  padding:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
}
.primary:disabled{opacity:.4;cursor:not-allowed}

/* ---- Classement ---- */
.rank-card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;color:var(--chalk);font-family:inherit;cursor:pointer;
}
.rank-pos{
  font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:20px;
  width:30px;text-align:center;color:var(--chalk-dim);flex-shrink:0;
}
.rank-pos.gold{font-size:22px}
.rank-avatar{font-size:24px;flex-shrink:0}
.rank-main{flex:1;min-width:0}
.rank-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.me-chip{font-size:10px;background:var(--line);border-radius:999px;padding:1px 7px;color:var(--chalk-dim)}
.rank-meta{font-size:12px;color:var(--chalk-dim);margin-top:2px}
.rank-right{text-align:right;flex-shrink:0}
.rank-profit{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.rank-sub{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.rank-bankroll{font-size:11px;color:var(--chalk-dim)}
.redep-chip{margin-left:6px;font-size:10px;background:rgba(245,197,67,.15);color:var(--gold);border-radius:999px;padding:1px 7px}
.deposit-card{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:flex;flex-direction:column;gap:12px;
}
.backup-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.file-btn{display:flex;align-items:center;justify-content:center;text-align:center}
.activity-card{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;display:flex;flex-direction:column;gap:6px;
}
.activity-line{font-size:12.5px;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-line:first-child{color:var(--chalk);font-weight:600}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;padding:8px 6px 6px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--chalk-dim)}
.legend-item i{width:10px;height:10px;border-radius:3px;display:inline-block}
.awards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.award{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;gap:10px;align-items:flex-start;
}
.award-icon{font-size:22px}
.award-title{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.award-who{font-size:13px;font-weight:600;margin-top:2px}
.award-detail{font-size:11px;color:var(--chalk-dim);margin-top:1px}

/* ---- Tickets ---- */
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{
  background:transparent;border:1px solid var(--line);border-radius:999px;
  color:var(--chalk-dim);padding:7px 14px;font-size:13px;font-family:inherit;
  cursor:pointer;white-space:nowrap;
}
.chip.sel{background:var(--gold);border-color:var(--gold);color:#081f14;font-weight:700}

.ticket{
  position:relative;background:#f7f4e8;color:#13231a;border-radius:14px;
  padding:14px 16px 12px;overflow:hidden;
}
.ticket::before,.ticket::after{
  content:"";position:absolute;width:18px;height:18px;border-radius:50%;
  background:var(--pitch);top:calc(50% + 14px);
}
.ticket::before{left:-9px}
.ticket::after{right:-9px}
.ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ticket-player{font-weight:700;font-size:13px}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 9px}
.badge.pending{background:#e7e2cd;color:#5a5a44}
.badge.won{background:#d6f2de;color:#1c7a3d}
.badge.lost{background:#fadcd6;color:#b2392a}
.badge.refund{background:#dde6f4;color:#3d5a8a}
.badge.cashout{background:#dcf0ec;color:#1c6e64}
.badge.fun{background:#efe3f8;color:#7a3db2}
.ticket-badges{display:flex;gap:6px;align-items:center}
.ticket-cashout{margin-top:8px;font-size:12px;color:#7a7a60;font-style:italic}
.win-panel{width:100%;background:#eee9d6;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.win-row{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#5a5a44}
.win-row input{background:#fff;border:1px solid #cfc9ad;border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;width:100%}
.win-chips{display:flex;gap:6px}
.chip.mini{padding:4px 10px;font-size:12px;background:#fff;border-color:#cfc9ad;color:#5a5a44}
.win-live{font-size:12px;font-weight:700;color:#1c6e64}
.win-hint{font-size:11px;color:#7a7a60;font-weight:400}
.win-actions{display:flex;gap:8px;justify-content:flex-end}
.reaction-row{display:flex;gap:6px;margin-top:10px}
.reaction{
  display:flex;align-items:center;gap:4px;background:#eee9d6;border:1px solid transparent;
  border-radius:999px;padding:4px 9px;font-size:14px;cursor:pointer;font-family:inherit;
}
.reaction.mine{border-color:#b89a2e;background:#f7ecc8}
.reaction-count{font-size:11px;font-weight:700;color:#5a5a44}
.ticket-match{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:18px;line-height:1.2}
.ticket-pick{font-size:13px;margin-top:3px;color:#3c4f42;font-weight:600}
.ticket-sel{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:4px}
.ticket-sel li{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.ticket-sel li span{color:#13231a}
.ticket-sel li em{font-style:normal;color:#3c4f42;font-weight:600;text-align:right;white-space:nowrap}
.stake-link{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:#1c5a8a;text-decoration:none;border-bottom:1px dashed #1c5a8a}
.proof-btn{display:block;margin-top:8px;background:none;border:none;padding:0;font-size:12px;font-weight:700;color:#1c5a8a;border-bottom:1px dashed #1c5a8a;cursor:pointer;font-family:inherit}
.proof-img{width:100%;border-radius:10px;margin-top:8px;border:1px solid #cfc9ad;display:block}
.proof-preview{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.proof-preview img{width:100%;border-radius:10px;border:1px solid var(--line)}
.proof-preview .act.del{align-self:flex-start;margin-left:0}
.field .opt{font-style:normal;color:var(--chalk-dim);font-weight:400;text-transform:none;letter-spacing:0}
.form-hint{font-size:12px}
.form-hint.warn{color:#f0a18f}
.form-hint.ok{color:var(--won)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.secondary{
  background:transparent;border:1px solid var(--gold);color:var(--gold);
  border-radius:12px;padding:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
.secondary:disabled{opacity:.4;cursor:not-allowed}
.secondary.danger{border-color:var(--loss);color:var(--loss)}
.import-block{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.import-block[open]{display:flex;flex-direction:column;gap:12px}
.import-block summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--chalk-dim);list-style:none}
.import-block summary::-webkit-details-marker{display:none}
.gain-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.gain-recap{font-size:11px;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.ticket-perf{border-top:2px dashed #cfc9ad;margin:12px -16px 10px}
.ticket-nums{display:flex;gap:18px;align-items:flex-end}
.ticket-nums>div{display:flex;flex-direction:column}
.ticket-nums small{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#7a7a60}
.ticket-nums strong{font-size:16px;font-variant-numeric:tabular-nums}
.ticket-nums .right{margin-left:auto;text-align:right}
.ticket-nums .pos{color:#1c7a3d}
.ticket-nums .neg{color:#b2392a}
/* Couleur du ticket selon le résultat du pari (lecture instantanée) */
.ticket.res-won{background:#ecf8f0;box-shadow:inset 5px 0 0 #2f9e57}
.ticket.res-lost{background:#fcece8;box-shadow:inset 5px 0 0 #d4503c}
.ticket.res-neutral{background:#f7f4e8}
.ticket-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{
  border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.act.won{background:#d6f2de;color:#1c7a3d}
.act.lost{background:#fadcd6;color:#b2392a}
.act.refund{background:#dde6f4;color:#3d5a8a}
.act.cashout{background:#dcf0ec;color:#1c6e64}
.act.del{background:#eee9d6;color:#7a7a60;margin-left:auto}
.act.del.confirm{background:#b2392a;color:#fff}
.act.undo{background:#e7e2cd;color:#5a5a44}

/* ---- Formulaire ---- */
.form-card{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:18px;
  padding:18px;display:flex;flex-direction:column;gap:14px;
}
.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gain-preview{
  display:flex;justify-content:space-between;align-items:center;
  border:1px dashed var(--line);border-radius:12px;padding:12px 14px;
  color:var(--chalk-dim);font-size:13px;
}
.gain-preview strong{font-family:'Saira Condensed',sans-serif;font-size:20px;color:var(--chalk-dim)}
.gain-preview.on strong{color:var(--gold)}

/* ---- Stats ---- */
.stats-hero{text-align:center;padding:10px 0 4px}
.stats-name{font-weight:700;font-size:16px}
.stats-profit{
  font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:44px;
  line-height:1.1;font-variant-numeric:tabular-nums;
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;display:flex;flex-direction:column;gap:3px;
}
.stat small{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--chalk-dim)}
.stat strong{font-size:15px;font-variant-numeric:tabular-nums}
.chart-card{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;
  padding:14px 10px 6px;
}
.chart-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);padding:0 6px 8px}

/* ---- Divers ---- */
.empty{text-align:center;padding:42px 16px;color:var(--chalk-dim)}
.empty-icon{font-size:38px;margin-bottom:10px}
.loading-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:70vh;font-size:30px}
.top-actions{display:flex;align-items:center;gap:8px}
.bell-btn{
  background:transparent;border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;font-size:15px;line-height:1;cursor:pointer;opacity:.55;
}
.bell-btn.on{opacity:1;border-color:var(--gold)}
.rank-badges{font-size:12px;letter-spacing:2px;margin-left:2px}
.rank-meta.streak{color:var(--gold);font-weight:700}
.rank-meta.streak.cold{color:#9fc4e0}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge-card{
  background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;gap:10px;align-items:flex-start;opacity:.42;
}
.badge-card.on{opacity:1;border-color:rgba(245,197,67,.55)}
.badge-card .b-icon{font-size:22px}
.badge-card .b-title{font-weight:700;font-size:13px}
.badge-card .b-desc{font-size:11px;color:var(--chalk-dim);margin-top:1px}
.badge-card .b-date{font-size:10px;color:var(--gold);margin-top:3px;font-weight:600}
.award-who b{font-variant-numeric:tabular-nums;color:var(--chalk)}
.comments{margin-top:10px;border-top:1px dashed #cfc9ad;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.comment{background:#efeada;border-radius:10px;padding:8px 10px}
.comment-head{display:flex;align-items:center;gap:8px;font-size:11px;color:#7a7a60}
.comment-author{font-weight:700;color:#13231a;font-size:12px}
.comment-del{margin-left:auto;background:none;border:none;color:#b2392a;cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
.comment-text{font-size:13.5px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.comment-input{display:flex;gap:8px;align-items:center}
.comment-input input{flex:1;background:#fff;border:1px solid #cfc9ad;border-radius:999px;padding:9px 14px;font-size:16px;font-family:inherit;color:#13231a;min-width:0}
.comment-input input:focus{outline:2px solid var(--gold)}
.comment-send{background:#13231a;color:#f7f4e8;border:none;border-radius:999px;width:38px;height:38px;font-size:14px;cursor:pointer;flex-shrink:0}
.comment-send:disabled{opacity:.35;cursor:not-allowed}
.cal-day{display:flex;flex-direction:column;gap:8px}
.cal-date{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);font-weight:700;padding-top:6px}
.cal-date.today{color:var(--gold)}
.cal-match{display:flex;align-items:center;gap:10px;background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cal-match.past{opacity:.45}
.cal-time{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--gold);width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.cal-teams{flex:1;font-size:13.5px;font-weight:600;min-width:0;line-height:1.45}
.cal-vs{color:var(--chalk-dim);font-weight:400;padding:0 5px}
.cal-phase{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--chalk-dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px;flex-shrink:0;white-space:nowrap}
.toast{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#081f14;font-weight:700;font-size:14px;
  border-radius:999px;padding:10px 20px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.35);
}

/* ---- v2 ---- */
.cal-date{position:sticky;top:52px;z-index:5;background:rgba(11,47,30,.96);padding:8px 0 4px;backdrop-filter:blur(4px)}
.ticket-meta{margin-top:8px;font-size:11px;color:#7a7a60;line-height:1.5}
.ticket-meta .lock-match{color:#3c4f42;font-weight:600}
.ticket-meta .lock.ok{color:#1c7a3d;font-weight:700}
.ticket-meta .lock.warn{color:#b2392a;font-weight:700}
.proof-img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 12px 48px rgba(0,0,0,.6)}
.activity-more{background:none;border:none;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;padding:4px 0 0}
.chip.mini.dark{background:transparent;border:1px solid var(--line);color:var(--chalk-dim)}
.code-banner{background:rgba(245,197,67,.1);border:1px solid rgba(245,197,67,.55);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;font-size:13.5px}
.code-banner b{font-family:'Saira Condensed',sans-serif;font-size:26px;letter-spacing:.2em;color:var(--gold)}
.code-banner .secondary{align-self:flex-start;padding:8px 16px;font-size:13px}
.claim-link{background:none;border:none;color:var(--chalk-dim);text-decoration:underline;font-size:13px;cursor:pointer;font-family:inherit;text-align:center;padding:4px}
.code-inline{font-family:'Saira Condensed',sans-serif;letter-spacing:.15em;color:var(--gold);font-size:15px;font-weight:700}

/* ===== v3 — Petit Prono, sous-nav, couleurs, comparaison ===== */
.sub-title{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.cal-item{display:flex;flex-direction:column;gap:6px}
.prono-row{display:flex;align-items:center;gap:8px;background:rgba(8,31,20,.55);border:1px solid var(--line);border-radius:10px;padding:7px 10px;flex-wrap:wrap}
.prono-row.locked{background:transparent;border-style:dashed;font-size:12.5px;color:var(--chalk-dim);padding:5px 10px}
.prono-lbl{font-size:12px;color:var(--chalk-dim);font-weight:600}
.prono-score{width:46px;text-align:center;background:#0a2718;border:1px solid var(--line);border-radius:8px;color:var(--chalk);padding:8px 4px;font-size:16px;font-family:inherit;-moz-appearance:textfield}
.prono-score::-webkit-outer-spin-button,.prono-score::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.prono-score:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.prono-dash{color:var(--chalk-dim);font-weight:700}
.prono-ok{background:var(--gold);color:#081f14;border:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;margin-left:auto}
.prono-ok:disabled{opacity:.4;cursor:not-allowed}
.prono-ok.danger{background:var(--loss);color:#fff}
.prono-mine{color:var(--chalk);font-weight:600}
.prono-res{color:var(--gold);font-weight:700}
.prono-card{background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prono-match{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.02em}
.prono-final{font-size:13px;color:var(--gold);font-weight:700}
.result-box{display:flex;flex-direction:column;gap:6px}
.prono-list{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:2px}
.prono-list li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:5px 9px;border-radius:8px;background:rgba(8,31,20,.5)}
.prono-list li b{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.prono-list li.exact{background:rgba(245,197,67,.16);color:var(--gold)}
.prono-list li.part{color:var(--won)}
.prono-list li.zero{color:var(--chalk-dim)}
.prono-list li.mine{outline:1px solid rgba(245,197,67,.5)}
.prono-list li span:first-child{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prono-list-score{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.prono-list-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--chalk-dim);margin-top:4px}
.prono-liverow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Statut + score d'un match (calendrier et pronostics) */
.cal-score{display:flex;align-items:center;gap:10px;padding:2px 2px 0 56px}
.cal-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--chalk-dim)}
.cal-status.ns{color:var(--chalk-dim)}
.cal-status.live{color:#ff6b53;border-color:rgba(255,107,83,.5);background:rgba(255,107,83,.12)}
.cal-status.ft{color:var(--won);border-color:rgba(92,201,122,.45);background:rgba(92,201,122,.1)}
.cal-status.pst,.cal-status.canc{color:#e0b15c;border-color:rgba(224,177,92,.45);background:rgba(224,177,92,.1)}
.cal-scoreline{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.live-dot{width:7px;height:7px;border-radius:50%;background:#ff6b53;display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.live-dot{animation:none}}
.subnav{display:flex;gap:6px;background:rgba(8,31,20,.6);border:1px solid var(--line);border-radius:12px;padding:4px}
.subnav-btn{flex:1;background:transparent;border:none;color:var(--chalk-dim);padding:9px 6px;font-size:12.5px;font-weight:700;font-family:inherit;border-radius:9px;cursor:pointer;white-space:nowrap}
.subnav-btn.sel{background:var(--gold);color:#081f14}
.pcolor-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;margin-right:1px}
.pcolor-dot.big{width:12px;height:12px;margin-right:5px;vertical-align:middle}
.ticket-color{position:absolute;left:0;top:0;bottom:0;width:5px;border-top-left-radius:14px;border-bottom-left-radius:14px}
.rank-card.mine{border-color:rgba(245,197,67,.45)}
.badge.void{background:#e3ddcf;color:#7a7a60}
.ticket.void{box-shadow:inset 4px 0 0 #9a8f6e;opacity:.72}
.act.void{background:#efe3d6;color:#9a6a2e}
.succ-row{display:flex;align-items:center;gap:8px;background:rgba(8,31,20,.7);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.succ-name{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.succ-icons{font-size:15px;letter-spacing:2px}
.succ-count{font-size:11px;color:var(--chalk-dim);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.records-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.record{background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.record .rec-ico{font-size:20px;flex-shrink:0}
.rec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--chalk-dim)}
.rec-val{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.rec-det{font-size:11px;color:var(--chalk-dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.compare-selectors{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.vs-badge{font-family:'Saira Condensed',sans-serif;font-weight:800;color:var(--gold);font-size:18px;padding-bottom:10px}
.face-banner{text-align:center;background:rgba(245,197,67,.1);border:1px solid rgba(245,197,67,.5);border-radius:12px;padding:12px;font-weight:700;font-size:14px}
.compare-table{background:rgba(8,31,20,.75);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column}
.cmp-head,.cmp-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;padding:8px 0;align-items:center}
.cmp-head{border-bottom:1px solid var(--line);font-weight:700;font-size:12px}
.cmp-head span:not(:first-child),.cmp-row span:not(:first-child){text-align:center;font-variant-numeric:tabular-nums}
.cmp-row{border-bottom:1px solid rgba(44,90,64,.4);font-size:13px}
.cmp-row:last-child{border-bottom:none}
.cmp-lbl{color:var(--chalk-dim);font-size:12px}
.cmp-a.win,.cmp-b.win{color:var(--gold);font-weight:800}
.tab-icon{font-size:17px}
.tab-label{font-size:10.5px;text-align:center;line-height:1.1;max-width:100%}
`;
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(App));

  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</body>
</html>
